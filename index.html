<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#8b70ff"><title>콩콩 미션</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff7e8;color:#40354b}
body{padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{border:0;touch-action:manipulation}
.app{width:100%;max-width:480px;margin:auto;min-height:100vh;padding:8px 10px 72px}
.hero{background:linear-gradient(135deg,#826cff,#ff76a9);color:white;border-radius:20px;padding:13px 14px;box-shadow:0 10px 24px #a270a833}
.hero h1{font-size:21px;line-height:1.1;margin:2px 0 4px}.hero p{margin:0;font-size:12px;font-weight:700;line-height:1.3}
.prog{display:flex;gap:9px;align-items:center;margin-top:8px;font-weight:900}.bar{height:12px;flex:1;background:#ffffff55;border-radius:20px;overflow:hidden}#fill{height:100%;background:#ffe26a;transition:.35s}
.title{font-size:16px;font-weight:900;margin:12px 2px 6px}
.parent{background:white;border-radius:16px;padding:9px;box-shadow:0 5px 16px #8f718b17}.add{display:flex;gap:7px}input{min-width:0;flex:1;border:2px solid #eadcf0;border-radius:14px;padding:9px 10px;font-size:14px;outline:none}.addBtn{min-width:58px;background:#ff72a4;color:white;border-radius:12px;font-weight:900}
.hint{font-size:10px;color:#8b7d90;margin:5px 2px 0}
.tasks{display:grid;gap:6px;margin-top:7px}.task{background:white;border-radius:14px;padding:8px 9px;display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:8px;box-shadow:0 5px 16px #8f718b18}.task .ico{font-size:19px}.task b{font-size:13px;line-height:1.2}.stamp{background:#745cff;color:#fff;border-radius:14px;padding:8px 8px;font-size:11px;font-weight:900;min-height:34px}.stamp:disabled{background:#bbb2c7}.delete{grid-column:2/4;background:none;color:#aa8292;text-align:right;font-size:10px;padding:0 3px}
.reward{background:#fff;border-radius:16px;padding:9px}.rewardView{margin-top:6px;background:#fff3bd;border-radius:13px;padding:8px;display:flex;gap:10px;align-items:center}.gift{font-size:27px}
.friends{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:1px}.friends::-webkit-scrollbar{display:none}.friend{min-width:0;background:#fff;border-radius:14px;padding:4px;text-align:center;scroll-snap-align:start;box-shadow:0 4px 14px #8f718b18;position:relative}.friend img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:14px}.friend span{display:block;font-size:10px;font-weight:900;padding:3px}.locked{filter:grayscale(.8);opacity:.48}.locked:after{content:"🔒";position:absolute;right:10px;top:10px;font-size:16px}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#fff;border-radius:15px;padding:8px}.seal{aspect-ratio:1;border:3px dashed #ead9e2;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#fffafd}.seal.on{background:#fff0a1;border-style:solid;border-color:#ff80ad}
.modal{position:fixed;inset:0;background:#35233eaa;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:480px;background:#fff;border-radius:30px 30px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));text-align:center;animation:up .3s}@keyframes up{from{transform:translateY(100%)}}.sheet img{width:150px;height:150px;object-fit:cover;border-radius:50%;border:6px solid #ffe16c}.sheet h2{font-size:22px;margin:10px 0 6px}.ok{width:100%;margin-top:8px;background:#745cff;color:white;border-radius:17px;padding:14px;font-weight:900;font-size:16px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#ffffffee;backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr;padding:4px 12px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #eee;z-index:10}.nav button{background:none;padding:4px;font-weight:900;color:#6d6072}.nav small{display:block;font-size:11px;margin-top:2px}

.locked{filter:none;opacity:1}.locked:after{content:"";}.locked img{filter:brightness(0) opacity(.18)}.locked span{color:#b9aec0}
.friend.new{animation:pop .6s}
.task.pop{animation:pop .55s}.seal.on{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-3deg)}60%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1)}}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.streak{background:#ffffff40;border-radius:12px;padding:1px 8px;font-size:12px;margin-left:4px}
#heroImg{animation:bounce 1s infinite alternate}@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

html,body{height:100%;overflow:hidden}
.app{height:100vh;height:100dvh;min-height:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:hidden}
.hero{padding:10px 12px;flex:none}.hero h1{font-size:19px;margin:2px 0 2px}.hero p{font-size:11px}.prog{margin-top:6px}
.title{font-size:14px;margin:2px 2px 0;flex:none}
.tscroll{flex:1;min-height:0;overflow-y:auto}.tasks{margin-top:0}
.task{padding:6px 8px;grid-template-columns:24px 1fr auto}.stamp{min-height:32px}
.board{flex:none;background:#fff;border-radius:16px;padding:6px 8px;display:flex;align-items:center;gap:8px}
.album{display:flex;flex-wrap:wrap;gap:5px;padding:0;background:none;flex:none;max-width:48%}
.seal{aspect-ratio:auto;width:30px;height:30px;border-width:2px;font-size:14px}
.seal.on{animation:none}.seal.pop2{animation:pop .5s}
.board .rewardView{margin:0;flex:1;min-width:0;padding:6px 8px}.board .gift{font-size:24px}.board .rewardView b{font-size:11px}.board .rewardView div div{font-size:12px;font-weight:900}
.friends{flex:none;grid-template-columns:repeat(7,1fr);gap:4px}
.friend{padding:2px;border-radius:10px}.friend img{border-radius:10px}.friend span{font-size:8px;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{max-height:92vh;overflow-y:auto}
.hw{position:relative;display:inline-block}
.bigstamp{position:absolute;right:-26px;bottom:-8px;border:5px solid #ff3d6e;color:#ff3d6e;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1.05;background:#fffc;opacity:0;pointer-events:none;transform:rotate(-18deg)}
.bigstamp.all{width:104px;height:104px;font-size:28px;border-width:6px;right:-34px}
.bigstamp.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(4) rotate(-45deg)}60%{opacity:1;transform:scale(.88) rotate(-18deg)}100%{opacity:.96;transform:scale(1) rotate(-18deg)}}
.sheet.shake{animation:up .3s,shake .35s .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

.hero{font-size:14px}.hero h1{font-size:25px;margin:3px 0 3px}.hero p{font-size:14px}.streak{font-size:14px}.prog{font-size:16px}.bar{height:14px}
.title{font-size:17px}
.task{padding:7px 9px;grid-template-columns:28px 1fr auto}.task .ico{font-size:22px}.task b{font-size:17px;line-height:1.2}.stamp{font-size:14px;padding:8px 10px;min-height:38px}
.seal{width:34px;height:34px;font-size:17px}
.board .gift{font-size:28px}.board .rewardView b{font-size:13px}.board .rewardView div div{font-size:16px}
.friend span{font-size:10px}
.sheet h2{font-size:26px}#modalText{font-size:19px;line-height:1.5}.sheet .ok{font-size:19px}
.bigstamp{font-size:24px}.bigstamp.all{font-size:32px}
.sheet p{font-size:14px!important}input{font-size:16px}
@media (max-height:700px){
.app{gap:4px;padding-top:6px}.hero{padding:8px 12px}.hero h1{font-size:22px;margin:1px 0 1px}.hero p{font-size:13px}.prog{margin-top:4px}
.title{font-size:15px;margin:0 2px}
.tasks{gap:4px}.task{padding:4px 8px}.task b{font-size:16px}.stamp{min-height:34px;padding:6px 9px}
.seal{width:28px;height:28px;font-size:14px}.album{max-width:42%;gap:4px}
.board{padding:5px 8px}.board .rewardView{padding:5px 7px}.board .rewardView b{font-size:12px;white-space:nowrap}.board .rewardView div div{font-size:15px}.board .gift{font-size:24px}
.friends{gap:3px}.friend{padding:1px}.friend span{font-size:9px}
}
.friends{grid-template-columns:repeat(5,1fr);gap:4px}
.friend{padding:2px;position:relative;overflow:hidden;border-radius:12px}.friend img{border-radius:10px}
.friend span{position:absolute;left:2px;right:2px;bottom:2px;padding:2px 1px;font-size:11px;color:#fff;background:#0007;border-radius:0 0 10px 10px;text-shadow:0 1px 2px #0008}
.locked span{top:2px;display:grid;place-items:center;background:none;color:#a99db0;font-size:26px;text-shadow:none;border-radius:10px}
</style></head><body><main class="app">
<section class="hero" style="position:relative"><button onclick="openParent()" aria-label="부모님 설정" style="position:absolute;right:10px;top:9px;background:#ffffff33;color:white;border-radius:12px;padding:6px 9px;font-size:16px">⚙️</button><b>🌈 오늘의 콩콩 어드벤처</b><span class="streak" id="streakBadge">🔥 0일</span><h1>미션하고 스탬프 콩! 💗</h1><p id="goalText"></p><div class="prog"><span id="stat">0/0</span><div class="bar"><div id="fill"></div></div><span>🏆</span></div></section>
<div class="title">🎯 오늘의 미션</div><div class="tscroll"><div id="tasks" class="tasks"></div></div>
<div class="board"><div id="album" class="album"></div><div class="rewardView"><span class="gift">🎁</span><div><b id="goalLine"></b><div id="rewardText"></div></div></div></div>
<div class="title">🐾 친구들</div><div id="friends" class="friends"></div>
</main>
<div class="modal" id="parentModal"><div class="sheet" style="text-align:left">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">👨‍👩‍👧 부모님 설정</h2><button onclick="document.getElementById('parentModal').classList.remove('show')" style="background:#f3edf5;border-radius:50%;width:36px;height:36px">✕</button></div>
<p style="font-size:12px;color:#83778b">아이 화면에는 설정 내용이 보이지 않습니다.</p>
<b>오늘 할 일 추가</b><div class="add" style="margin-top:7px"><input id="newTask" maxlength="35" placeholder="예: 양치하기"><button class="addBtn" onclick="addTask()">추가</button></div>
<div id="parentTaskList" style="margin:9px 0 15px"></div>
<b>상 받을 스탬프 개수</b><div class="add" style="margin:7px 0 15px"><input id="goalInput" type="number" min="1" max="20" inputmode="numeric" placeholder="예: 4"><button class="addBtn" onclick="saveGoal()">저장</button></div>
<b>스탬프를 모았을 때 받을 상</b><div class="add" style="margin-top:7px"><input id="rewardInput" maxlength="40" placeholder="예: 놀이 30분"><button class="addBtn" onclick="saveReward()">저장</button></div>
<b style="display:block;margin-top:15px">축하 사진 (목표를 달성하면 나와요)</b><p style="margin:4px 0">얼굴을 가린 사진을 골라주세요. 이 기기에만 저장되고 인터넷에 올라가지 않아요.</p><div class="add"><input id="photoInput" type="file" accept="image/*"><button class="addBtn" onclick="clearPhoto()">지우기</button></div><img id="photoPrev" alt="" style="display:none;width:72px;height:72px;border-radius:50%;object-fit:cover;margin-top:7px;border:3px solid #ffe16c">
<b style="display:block;margin-top:15px">설정 비밀번호 (숫자 4자리)</b><p id="pinState" style="margin:4px 0"></p><div class="add"><input id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="새 비밀번호"><button class="addBtn" onclick="savePin()">저장</button></div><button onclick="removePin()" style="background:none;color:#aa8292;font-size:13px;padding:6px 2px">비밀번호 해제</button>
<button class="ok" onclick="document.getElementById('parentModal').classList.remove('show')">설정 완료 ✓</button></div></div><div class="modal" id="modal"><div class="sheet"><div style="font-size:36px">🎉✨</div><div class="hw"><img id="heroImg"><span class="bigstamp" id="bigStamp"></span></div><h2 id="msg"></h2><div id="modalText"></div><button class="ok" onclick="document.getElementById('modal').classList.remove('show')">좋아요! 다음 미션 💗</button></div></div>
<div class="modal" id="pinModal"><div class="sheet"><h2>🔒 부모님 확인</h2><p>비밀번호 4자리를 입력하세요</p><input id="pinInput" type="password" inputmode="numeric" maxlength="4" style="width:100%;text-align:center;font-size:28px;letter-spacing:10px"><div id="pinErr" style="color:#e0457b;font-weight:900;min-height:24px;margin-top:6px"></div><button class="ok" onclick="checkPin()">확인</button><button class="ok" style="background:#f3edf5;color:#6d6072" onclick="closePin()">취소</button></div></div>
<script>
const friendsData=[{"name": "몽글이", "src": "images/friend01.jpg"}, {"name": "빨강이", "src": "images/friend02.jpg"}, {"name": "코코", "src": "images/friend03.jpg"}, {"name": "코코2", "src": "images/friend04.jpg"}, {"name": "주황이", "src": "images/friend05.jpg"}, {"name": "피카", "src": "images/friend06.jpg"}, {"name": "곰곰이", "src": "images/friend07.jpg"}, {"name": "토토", "src": "images/friend08.jpg"}, {"name": "우디", "src": "images/friend09.jpg"}, {"name": "핑키", "src": "images/friend10.jpg"}, {"name": "콩이", "src": "images/friend11.jpg"}, {"name": "방울이", "src": "images/friend12.jpg"}, {"name": "오늘의 주인공", "src": "images/friend13.jpg"}];
let missions=JSON.parse(localStorage.getItem("mobileKongTasks")||"[]");
let done=JSON.parse(localStorage.getItem("mobileKongDone")||"[]");
let reward=localStorage.getItem("mobileKongReward")||"";
let total=+(localStorage.getItem("mobileKongTotal")||0);
let streak=+(localStorage.getItem("mobileKongStreak")||0);
let lastPop=-1,newFriend=-1;
let photo="";try{photo=localStorage.getItem("mobileKongPhoto")||""}catch(e){}
let goal=+(localStorage.getItem("mobileKongGoal")||4);
const eff=()=>Math.max(1,Math.min(goal,missions.length||goal));
const ds=d=>d.toLocaleDateString("sv");
(function(){const today=ds(new Date()),last=localStorage.getItem("mobileKongDay");
 if(last&&last!==today){const y=new Date();y.setDate(y.getDate()-1);
  const wasAll=done.filter(Boolean).length>=eff();
  if(!(wasAll&&last===ds(y)))streak=0;
  done=missions.map(()=>false);}
 localStorage.setItem("mobileKongDay",today);localStorage.setItem("mobileKongStreak",streak);
 localStorage.setItem("mobileKongDone",JSON.stringify(done));})();
function save(){localStorage.setItem("mobileKongTasks",JSON.stringify(missions));localStorage.setItem("mobileKongDone",JSON.stringify(done));localStorage.setItem("mobileKongTotal",total);localStorage.setItem("mobileKongStreak",streak);}
const praise=["우와 대단해!","최고야!","멋지다 멋져!","쑥쑥 크는 중!","야호! 해냈다!","역시 우리 친구!","짝짝짝! 박수!"];
const josa=n=>{const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?"이":"가"};
function confetti(n){const e=["⭐","✨","💗","🎉","🌈","🎈"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.fontSize=(16+Math.random()*18)+"px";s.style.setProperty("--r",(Math.random()*720-360)+"deg");s.style.animationDuration=(1.6+Math.random()*1.6)+"s";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4000)}}
function sound(big){try{const A=new(window.AudioContext||window.webkitAudioContext)();if(big){const o=A.createOscillator(),k=A.createGain();o.frequency.setValueAtTime(140,A.currentTime);o.frequency.exponentialRampToValueAtTime(40,A.currentTime+.25);k.gain.setValueAtTime(.5,A.currentTime);k.gain.exponentialRampToValueAtTime(.001,A.currentTime+.3);o.connect(k);k.connect(A.destination);o.start();o.stop(A.currentTime+.3)}const notes=big?[523,659,784,1047,1319]:[659,880];notes.forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(A.destination);const t=A.currentTime+i*.12;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}if(navigator.vibrate)navigator.vibrate(big?[60,40,60,40,120]:40)}
function render(){
 const n=done.filter(Boolean).length,t=missions.length,g=eff(),popNow=lastPop>=0;stat.textContent=Math.min(n,g)+"/"+g;fill.style.width=Math.min(100,n/g*100)+"%";goalText.textContent=n>=g?"오늘 미션 완료! 최고야 🏆":"스탬프 "+g+"개 모으면 상이 기다려요!";goalLine.textContent="스탬프 "+g+"개 모으면";
 tasks.innerHTML=t?missions.map((m,i)=>`<div class="task${i===lastPop?" pop":""}"><span class="ico">${done[i]?"⭐":"🌟"}</span><b>${m}</b><button class="stamp" ${done[i]?"disabled":""} onclick="stampIt(${i})">${done[i]?"완료 ✓":"스탬프 콩!"}</button></div>`).join(""):`<div style="background:#fff;padding:25px;text-align:center;border-radius:20px;color:#8b7d90"><b>오늘 할 일을 먼저 넣어주세요 💗</b></div>`;
 friends.innerHTML=friendsData.map((f,i)=>`<div class="friend ${i<total?"":"locked"} ${i===newFriend?"new":""}"><img src="${f.src}"><span>${i<total?f.name:"?"}</span></div>`).join("");
  streakBadge.textContent="🔥 "+streak+"일";lastPop=-1;newFriend=-1;
 album.innerHTML=Array.from({length:g},(_,i)=>`<div class="seal ${i<n?"on":""}${i===n-1&&popNow?" pop2":""}">${i<n?"⭐":"?"}</div>`).join("");
 rewardText.textContent=reward||"오늘의 상이 기다리고 있어요!";
 rewardInput.value=reward;goalInput.value=goal;pinState.textContent=pinHash?"현재: 설정됨 🔒":"아직 없음 — 정하면 아이가 설정 화면을 열 수 없어요";photoPrev.style.display=photo?"block":"none";if(photo)photoPrev.src=photo;
 parentTaskList.innerHTML=t?missions.map((m,i)=>`<div style="display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid #eee"><span style="flex:1;font-size:13px">${i+1}. ${m}</span><button onclick="removeTask(${i})" style="background:#fff0f4;color:#a9677e;border-radius:9px;padding:6px 8px">삭제</button></div>`).join(""):`<div style="font-size:12px;color:#8b7d90;padding:8px 0">등록된 할 일이 없습니다.</div>`;
}
const hp=p=>{let h=5381;for(const c of "kk"+p)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
let pinHash="";try{pinHash=localStorage.getItem("mobileKongPin")||""}catch(e){}
function showParent(){document.getElementById("parentModal").classList.add("show");render()}
function openParent(){if(!pinHash){showParent();return}pinInput.value="";pinErr.textContent="";pinModal.classList.add("show");setTimeout(()=>pinInput.focus(),60)}
function closePin(){pinModal.classList.remove("show")}
function checkPin(){if(hp(pinInput.value)===pinHash){closePin();showParent()}else{pinErr.textContent="비밀번호가 달라요";pinInput.value=""}}
function savePin(){const v=newPin.value.trim();if(!/^\d{4}$/.test(v)){alert("숫자 4자리를 입력해주세요");return}pinHash=hp(v);try{localStorage.setItem("mobileKongPin",pinHash)}catch(e){}newPin.value="";render();alert("비밀번호를 저장했어요")}
function removePin(){pinHash="";try{localStorage.removeItem("mobileKongPin")}catch(e){}render()}
pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")checkPin()});
function addTask(){let v=newTask.value.trim();if(!v)return;missions.push(v);done.push(false);newTask.value="";save();render()}
function removeTask(i){missions.splice(i,1);done.splice(i,1);save();render()}
function clearPhoto(){photo="";try{localStorage.removeItem("mobileKongPhoto")}catch(e){}photoInput.value="";render()}
photoInput.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S=480,c=document.createElement("canvas");c.width=c.height=S;const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;c.getContext("2d").drawImage(im,sx,sy,m,m,0,0,S,S);photo=c.toDataURL("image/jpeg",.82);try{localStorage.setItem("mobileKongPhoto",photo)}catch(err){alert("사진을 저장하지 못했어요. 더 작은 사진으로 해보세요.")}render()};im.src=r.result};r.readAsDataURL(f)});
function saveGoal(){goal=Math.max(1,Math.min(20,parseInt(goalInput.value)||4));localStorage.setItem("mobileKongGoal",goal);render()}
function saveReward(){reward=rewardInput.value.trim();localStorage.setItem("mobileKongReward",reward);render()}
function stampIt(i){if(done[i])return;done[i]=true;total++;lastPop=i;let n=done.filter(Boolean).length;let fi=(total-1)%friendsData.length;let f=friendsData[fi];if(total<=friendsData.length)newFriend=fi;heroImg.src=f.src;msg.textContent=f.name+josa(f.name)+" 스탬프를 콩!";let g=eff();let all=n===g;if(all&&photo){heroImg.src=photo;msg.textContent="🎉 오늘 미션 완료! 최고야!"}
bigStamp.className="bigstamp"+(all?" all":"");bigStamp.innerHTML=all?"완료<br>쾅!":"콩!";const sh=document.querySelector("#modal .sheet");sh.classList.remove("shake");void bigStamp.offsetWidth;bigStamp.classList.add("slam");if(all)sh.classList.add("shake");if(all)streak++;save();confetti(all?70:22);sound(all);modalText.innerHTML=all?`🏆 <b>스탬프 ${g}개 모으기 성공!</b><br>🔥 ${streak}일 연속!<br><br>🎁 받을 상<br><b style="font-size:16px">${reward||"오늘의 특별한 상"}</b><br><br>정말 멋지게 해냈어요!`:`${praise[Math.floor(Math.random()*praise.length)]}<br><b>${n}번째 스탬프</b>를 받았어요 ⭐${n<g?"<br>상까지 "+(g-n)+"개 남았어요!":""}`;render();document.getElementById("modal").classList.add("show")}
document.getElementById("newTask").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});render();
</script></body></html>
