<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#8b70ff"><title>콩콩 미션</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff7e8;color:#40354b}
body{padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{border:0;touch-action:manipulation}
.app{width:100%;max-width:480px;margin:auto;min-height:100vh;padding:8px 10px 72px}
.hero{background:linear-gradient(135deg,#826cff,#ff76a9);color:white;border-radius:20px;padding:13px 14px;box-shadow:0 10px 24px #a270a833}
.hero h1{font-size:21px;line-height:1.1;margin:2px 0 4px}.hero p{margin:0;font-size:12px;font-weight:700;line-height:1.3}
.prog{display:flex;gap:9px;align-items:center;margin-top:8px;font-weight:900}.bar{height:12px;flex:1;background:#ffffff55;border-radius:20px;overflow:hidden}#fill{height:100%;background:#ffe26a;transition:.35s}
.title{font-size:16px;font-weight:900;margin:12px 2px 6px}
.parent{background:white;border-radius:16px;padding:9px;box-shadow:0 5px 16px #8f718b17}.add{display:flex;gap:7px}input{min-width:0;flex:1;border:2px solid #eadcf0;border-radius:14px;padding:9px 10px;font-size:14px;outline:none}.addBtn{min-width:58px;background:#ff72a4;color:white;border-radius:12px;font-weight:900}
.hint{font-size:10px;color:#8b7d90;margin:5px 2px 0}
.tasks{display:grid;gap:6px;margin-top:7px}.task{background:white;border-radius:14px;padding:8px 9px;display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:8px;box-shadow:0 5px 16px #8f718b18}.task .ico{font-size:19px}.task b{font-size:13px;line-height:1.2}.stamp{background:#745cff;color:#fff;border-radius:14px;padding:8px 8px;font-size:11px;font-weight:900;min-height:34px}.stamp:disabled{background:#bbb2c7}.delete{grid-column:2/4;background:none;color:#aa8292;text-align:right;font-size:10px;padding:0 3px}
.reward{background:#fff;border-radius:16px;padding:9px}.rewardView{margin-top:6px;background:#fff3bd;border-radius:13px;padding:8px;display:flex;gap:10px;align-items:center}.gift{font-size:27px}
.friends{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:1px}.friends::-webkit-scrollbar{display:none}.friend{min-width:0;background:#fff;border-radius:14px;padding:4px;text-align:center;scroll-snap-align:start;box-shadow:0 4px 14px #8f718b18;position:relative}.friend img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:14px}.friend span{display:block;font-size:10px;font-weight:900;padding:3px}.locked{filter:grayscale(.8);opacity:.48}.locked:after{content:"🔒";position:absolute;right:10px;top:10px;font-size:16px}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#fff;border-radius:15px;padding:8px}.seal{aspect-ratio:1;border:3px dashed #ead9e2;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#fffafd}.seal.on{background:#fff0a1;border-style:solid;border-color:#ff80ad}
.modal{position:fixed;inset:0;background:#35233eaa;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:480px;background:#fff;border-radius:30px 30px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));text-align:center;animation:up .3s}@keyframes up{from{transform:translateY(100%)}}.sheet img{width:150px;height:150px;object-fit:cover;border-radius:50%;border:6px solid #ffe16c}.sheet h2{font-size:22px;margin:10px 0 6px}.ok{width:100%;margin-top:8px;background:#745cff;color:white;border-radius:17px;padding:14px;font-weight:900;font-size:16px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#ffffffee;backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr;padding:4px 12px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #eee;z-index:10}.nav button{background:none;padding:4px;font-weight:900;color:#6d6072}.nav small{display:block;font-size:11px;margin-top:2px}

.locked{filter:none;opacity:1}.locked:after{content:"";}.locked img{filter:brightness(0) opacity(.18)}.locked span{color:#b9aec0}
.friend.new{animation:pop .6s}
.task.pop{animation:pop .55s}.seal.on{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-3deg)}60%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1)}}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.streak{background:#ffffff40;border-radius:12px;padding:1px 8px;font-size:12px;margin-left:4px}
#heroImg{animation:bounce 1s infinite alternate}@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
</style></head><body><main class="app">
<section class="hero" style="position:relative"><button onclick="openParent()" aria-label="부모님 설정" style="position:absolute;right:10px;top:9px;background:#ffffff33;color:white;border-radius:12px;padding:6px 9px;font-size:16px">⚙️</button><b>🌈 오늘의 콩콩 어드벤처</b><span class="streak" id="streakBadge">🔥 0일</span><h1>미션하고 스탬프 콩! 💗</h1><p>오늘 할 일을 하나씩 끝내고<br>귀여운 친구 스탬프를 모아봐!</p><div class="prog"><span id="stat">0/0</span><div class="bar"><div id="fill"></div></div><span>🏆</span></div></section>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px">
<div style="background:#fff;border-radius:13px;padding:8px;text-align:center"><b id="missionCount">0개</b><small style="display:block">오늘 미션</small></div>
<div style="background:#fff;border-radius:13px;padding:8px;text-align:center"><b id="starCount">⭐ 0</b><small style="display:block">받은 스탬프</small></div>
<div style="background:#fff;border-radius:13px;padding:8px;text-align:center"><b>🎁</b><small id="rewardMini" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">오늘의 상</small></div>
</div>
<div class="title">🎯 오늘의 미션</div><div id="tasks" class="tasks"></div>
<div class="rewardView" style="margin-top:9px"><span class="gift">🎁</span><div><b>미션을 모두 완료하면</b><div id="rewardText">오늘의 상이 기다리고 있어요!</div></div></div>
<div class="title">🐾 친구들</div><div id="friends" class="friends"></div>
<div class="title">✨ 스탬프판</div><div id="album" class="album"></div>
</main>
<nav class="nav"><button onclick="scrollTo({top:0,behavior:'smooth'})">🏠<small>오늘 미션</small></button><button onclick="document.getElementById('friends').scrollIntoView({behavior:'smooth'})">🐾<small>친구들</small></button></nav>
<div class="modal" id="parentModal"><div class="sheet" style="text-align:left">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">👨‍👩‍👧 부모님 설정</h2><button onclick="document.getElementById('parentModal').classList.remove('show')" style="background:#f3edf5;border-radius:50%;width:36px;height:36px">✕</button></div>
<p style="font-size:12px;color:#83778b">아이 화면에는 설정 내용이 보이지 않습니다.</p>
<b>오늘 할 일 추가</b><div class="add" style="margin-top:7px"><input id="newTask" maxlength="35" placeholder="예: 양치하기"><button class="addBtn" onclick="addTask()">추가</button></div>
<div id="parentTaskList" style="margin:9px 0 15px"></div>
<b>모두 완료했을 때 받을 상</b><div class="add" style="margin-top:7px"><input id="rewardInput" maxlength="40" placeholder="예: 놀이 30분"><button class="addBtn" onclick="saveReward()">저장</button></div>
<button class="ok" onclick="document.getElementById('parentModal').classList.remove('show')">설정 완료 ✓</button></div></div><div class="modal" id="modal"><div class="sheet"><div style="font-size:36px">🎉✨</div><img id="heroImg"><h2 id="msg"></h2><div id="modalText"></div><button class="ok" onclick="document.getElementById('modal').classList.remove('show')">좋아요! 다음 미션 💗</button></div></div>
<script>
const friendsData=[{"name": "몽글이", "src": "images/friend01.jpg"}, {"name": "빨강이", "src": "images/friend02.jpg"}, {"name": "코코", "src": "images/friend03.jpg"}, {"name": "코코2", "src": "images/friend04.jpg"}, {"name": "주황이", "src": "images/friend05.jpg"}, {"name": "피카", "src": "images/friend06.jpg"}, {"name": "곰곰이", "src": "images/friend07.jpg"}, {"name": "토토", "src": "images/friend08.jpg"}, {"name": "우디", "src": "images/friend09.jpg"}, {"name": "핑키", "src": "images/friend10.jpg"}, {"name": "콩이", "src": "images/friend11.jpg"}, {"name": "방울이", "src": "images/friend12.jpg"}, {"name": "오늘의 주인공", "src": "images/friend13.jpg"}];
let missions=JSON.parse(localStorage.getItem("mobileKongTasks")||"[]");
let done=JSON.parse(localStorage.getItem("mobileKongDone")||"[]");
let reward=localStorage.getItem("mobileKongReward")||"";
let total=+(localStorage.getItem("mobileKongTotal")||0);
let streak=+(localStorage.getItem("mobileKongStreak")||0);
let lastPop=-1,newFriend=-1;
const ds=d=>d.toLocaleDateString("sv");
(function(){const today=ds(new Date()),last=localStorage.getItem("mobileKongDay");
 if(last&&last!==today){const y=new Date();y.setDate(y.getDate()-1);
  const wasAll=missions.length&&done.length===missions.length&&done.every(Boolean);
  if(!(wasAll&&last===ds(y)))streak=0;
  done=missions.map(()=>false);}
 localStorage.setItem("mobileKongDay",today);localStorage.setItem("mobileKongStreak",streak);
 localStorage.setItem("mobileKongDone",JSON.stringify(done));})();
function save(){localStorage.setItem("mobileKongTasks",JSON.stringify(missions));localStorage.setItem("mobileKongDone",JSON.stringify(done));localStorage.setItem("mobileKongTotal",total);localStorage.setItem("mobileKongStreak",streak);}
const praise=["우와 대단해!","최고야!","멋지다 멋져!","쑥쑥 크는 중!","야호! 해냈다!","역시 우리 친구!","짝짝짝! 박수!"];
const josa=n=>{const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?"이":"가"};
function confetti(n){const e=["⭐","✨","💗","🎉","🌈","🎈"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.fontSize=(16+Math.random()*18)+"px";s.style.setProperty("--r",(Math.random()*720-360)+"deg");s.style.animationDuration=(1.6+Math.random()*1.6)+"s";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4000)}}
function sound(big){try{const A=new(window.AudioContext||window.webkitAudioContext)();const notes=big?[523,659,784,1047,1319]:[659,880];notes.forEach((f,i)=>{const o=A.createOscillator(),g=A.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(A.destination);const t=A.currentTime+i*.12;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)})}catch(e){}if(navigator.vibrate)navigator.vibrate(big?[60,40,60,40,120]:40)}
function render(){
 const n=done.filter(Boolean).length,t=missions.length;stat.textContent=n+"/"+t;fill.style.width=(t?n/t*100:0)+"%";
 tasks.innerHTML=t?missions.map((m,i)=>`<div class="task${i===lastPop?" pop":""}"><span class="ico">${done[i]?"⭐":"🌟"}</span><b>${m}</b><button class="stamp" ${done[i]?"disabled":""} onclick="stampIt(${i})">${done[i]?"완료 ✓":"스탬프 콩!"}</button><button class="delete" onclick="removeTask(${i})">이 할 일 삭제</button></div>`).join(""):`<div style="background:#fff;padding:25px;text-align:center;border-radius:20px;color:#8b7d90"><b>오늘 할 일을 먼저 넣어주세요 💗</b></div>`;
 friends.innerHTML=friendsData.map((f,i)=>`<div class="friend ${i<total?"":"locked"} ${i===newFriend?"new":""}"><img src="${f.src}"><span>${i<total?f.name:"?"}</span></div>`).join("");
  streakBadge.textContent="🔥 "+streak+"일";lastPop=-1;newFriend=-1;
 album.innerHTML=Array.from({length:Math.max(t,5)},(_,i)=>`<div class="seal ${done[i]?"on":""}">${done[i]?"⭐":"?"}</div>`).join("");
 rewardText.textContent=reward||"오늘의 상이 기다리고 있어요!";
 rewardInput.value=reward; missionCount.textContent=t+"개"; starCount.textContent="⭐ "+n;
 rewardMini.textContent=reward||"오늘의 상";
 parentTaskList.innerHTML=t?missions.map((m,i)=>`<div style="display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid #eee"><span style="flex:1;font-size:13px">${i+1}. ${m}</span><button onclick="removeTask(${i})" style="background:#fff0f4;color:#a9677e;border-radius:9px;padding:6px 8px">삭제</button></div>`).join(""):`<div style="font-size:12px;color:#8b7d90;padding:8px 0">등록된 할 일이 없습니다.</div>`;
}
function openParent(){document.getElementById("parentModal").classList.add("show");render()}
function addTask(){let v=newTask.value.trim();if(!v)return;missions.push(v);done.push(false);newTask.value="";save();render()}
function removeTask(i){missions.splice(i,1);done.splice(i,1);save();render()}
function saveReward(){reward=rewardInput.value.trim();localStorage.setItem("mobileKongReward",reward);render()}
function stampIt(i){if(done[i])return;done[i]=true;total++;lastPop=i;let n=done.filter(Boolean).length;let fi=(total-1)%friendsData.length;let f=friendsData[fi];if(total<=friendsData.length)newFriend=fi;heroImg.src=f.src;msg.textContent=f.name+josa(f.name)+" 스탬프를 콩!";let all=missions.length&&done.every(Boolean);if(all)streak++;save();confetti(all?70:22);sound(all);modalText.innerHTML=all?`🏆 <b>오늘의 할 일 전부 성공!</b><br>🔥 ${streak}일 연속!<br><br>🎁 받을 상<br><b style="font-size:16px">${reward||"오늘의 특별한 상"}</b><br><br>정말 멋지게 해냈어요!`:`${praise[Math.floor(Math.random()*praise.length)]}<br><b>${n}번째 스탬프</b>를 받았어요 ⭐`;render();document.getElementById("modal").classList.add("show")}
document.getElementById("newTask").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});render();
</script></body></html>
